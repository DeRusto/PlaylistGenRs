# Push a tag like v0.1.0 to build both binaries and publish a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: pip install ziglang && cargo install --locked cargo-zigbuild
      - run: make test
      - run: make build-gui build-static check-gui check-static
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/x86_64-unknown-linux-gnu/release/playlistgenrs "playlistgenrs-$GITHUB_REF_NAME-linux-x86_64"
          cp target/x86_64-unknown-linux-musl/release/playlistgenrs "playlistgenrs-$GITHUB_REF_NAME-linux-x86_64-cli-static"
          gh release create "$GITHUB_REF_NAME" --generate-notes playlistgenrs-*
