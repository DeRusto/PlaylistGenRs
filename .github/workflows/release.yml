# Push a tag like v0.1.0 to build both binaries and publish a GitHub release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y musl-tools mingw-w64
      - run: pip install ziglang && cargo install --locked cargo-zigbuild
      - run: make test
      - run: make build-gui build-static
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Check portability
        run: |
          glibc=$(objdump -T target/x86_64-unknown-linux-gnu/release/playlistgenrs | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $glibc"
          test "$(printf '%s\nGLIBC_2.17\n' "$glibc" | sort -V | tail -1)" = GLIBC_2.17
          file target/x86_64-unknown-linux-musl/release/playlistgenrs | grep -q 'statically linked\|static-pie linked'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/x86_64-unknown-linux-gnu/release/playlistgenrs "playlistgenrs-$GITHUB_REF_NAME-linux-x86_64"
          cp target/x86_64-unknown-linux-musl/release/playlistgenrs "playlistgenrs-$GITHUB_REF_NAME-linux-x86_64-cli-static"
          cp target/x86_64-pc-windows-gnu/release/playlistgenrs.exe "playlistgenrs-$GITHUB_REF_NAME-windows-x86_64.exe"
          gh release upload "$GITHUB_REF_NAME" playlistgenrs-*
